services:
  db:
    image: postgres:15.15-trixie
    container_name: mi_bd_postgre
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-usuario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-usuario1234}
      POSTGRES_DB: ${POSTGRES_DB:-bd_flask}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    container_name: mi_backend
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-usuario}:${POSTGRES_PASSWORD:-usuario1234}@db:5432/${POSTGRES_DB:-bd_flask}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-insecure-change-in-prod}
    volumes:
      - .:/app

  pgadmin:                  
    image: dpage/pgadmin4
    container_name: mi_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:

  